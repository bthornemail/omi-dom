# Canonical REGEX constraint mapping (serialized for bootstrap)
# Source: OMI-IMO Specification §21 + Untitled 70 YAML Codex
regex_constraints:
  - name: FRONT
    pattern: "^[A-Za-z0-9:+]$"
    meaning: "the front boundary"
    dimension: -1
    correlation: "0x0000"
  - name: BACK
    pattern: "^[A-Za-z0-9.\\-]$"
    meaning: "the back boundary"
    dimension: -1
    correlation: "Omicron"
  - name: INSIDE
    pattern: "^[A-Za-z0-9_]$"
    meaning: "interior token"
    dimension: -1
    correlation: "Imago Dei"
  - name: OUTSIDE
    pattern: "^[^A-Za-z0-9_]$"
    meaning: "exterior token"
    dimension: -1
    correlation: "3!"
  - name: UP
    pattern: "^[A-Z_]$"
    meaning: "the up boundary"
    dimension: -1
    correlation: "Imago Dei"
  - name: DOWN
    pattern: "^[a-z_]$"
    meaning: "the down boundary"
    dimension: -1
    correlation: "3!"
  - name: LEFT
    pattern: "^[0-9+\\-]\\.[^0-9+\\-]$"
    meaning: "the left boundary"
    dimension: -1
    correlation: "76"
  - name: RIGHT
    pattern: "^[^0-9+\\-]\\.[0-9+\\-]$"
    meaning: "the right boundary"
    dimension: -1
    correlation: "155"
  - name: CENTER
    pattern: "^[0-9]\\.[0-9]$"
    meaning: "the center boundary"
    dimension: -1
    correlation: "651"
  - name: CONSTRAINT
    pattern: "^[^\"]+$"
    meaning: "unquoted constraint body"
    dimension: -1
  - name: BOUNDARY
    pattern: "^\"([^\"]+)\"$"
    meaning: "quoted boundary"
    dimension: -1
  - name: DEFLECT
    pattern: "^([^\".]+):\\1$"
    meaning: "deflection symmetry"
    dimension: -1
  - name: REFLECT
    pattern: "^([\"\\.]+):\\1$"
    meaning: "reflection symmetry"
    dimension: -1
  - name: INFLECT
    pattern: "^([\"\\.]+):([\"\\.]+):\\2:\\1$"
    meaning: "inflection symmetry"
    dimension: -1
  - name: AXIS
    pattern: "^(\\d\\d)[A-Za-z_](\\d\\d):\\2[0-9+\\-]\\1$"
    meaning: "axis mnemonic"
    dimension: -1
  - name: MNEMONIC
    pattern: "^(\\d\\d)([A-Z_]?[a-z_]+)(\\d\\d):\\3\\2\\1$"
    meaning: "full mnemonic form"
    dimension: -1
  - name: PALINDROME
    pattern: "^(\\d\\d)[A-Za-z_\\-](\\d\\d):\\2[0-9_\\-]\\1$"
    meaning: "palindromic form"
    dimension: -1

# Practical attribute validators used by the DOM stack (derived)
omi_attributes:
  - name: OMI_MNEMONIC
    pattern: "^[A-Za-z0-9]{2,8}$"
    used_on: "data-omi-mnemonic"
  - name: OMI_BAND
    pattern: "^[0-9]{1,2}$"
    used_on: "data-omi-band"
  - name: OMI_OFFSET
    pattern: "^[0-9]+$"
    used_on: "data-omi-offset"
  - name: OMI_BPE
    pattern: "^[1248]$"
    used_on: "data-omi-bpe-constraint"
  - name: OMI_HIT_LIST
    pattern: "^[0-9]+(,[0-9]+)*$"
    used_on: "data-omi-hit-list"
  - name: OMI_ID
    pattern: "^[a-z][a-z0-9\\-]*$"
    used_on: "id"

# Constraint mechanism layers (from YAML Codex)
# Native dual-mode: text (UTF-8 string) and binary (Uint8Array / Buffer / ArrayBuffer)
constraint_mechanism:
  description: >
    The −5D → −1D regex constraint pipeline defines what can be parsed.
    It accepts text or binary natively; the same layer sequence is applied
    to both representations.
  input_modes:
    - text: "string / decoded UTF-8"
    - binary: "Uint8Array | Buffer | ArrayBuffer | byte array"
  layers:
    - dimension: -5
      pattern: "//g"
      constraint: global
      correlation: "0x0000"
      binary: "whole buffer as single unit"
    - dimension: -4
      pattern: "/color/g"
      constraint: color
      correlation: "Omicron"
      binary: "skipped (text-oriented)"
    - dimension: -3
      pattern: "\\r\\n"
      constraint: delimiter
      correlation: "Imago Dei"
      binary: "CRLF (0x0D 0x0A) / LF / CR byte sequences"
    - dimension: -2
      pattern: "[^a-zA-Z0-9]"
      constraint: non-alphanumeric
      correlation: "3!"
      binary: "runs of bytes outside 0-9A-Za-z"
    - dimension: -1
      pattern: "[a-zA-Z0-9]"
      constraint: alphanumeric
      correlation: "76"
      binary: "runs of bytes in 0-9A-Za-z"
    - dimension: 0
      pattern: "//g"
      constraint: compareExchange
      correlation: "155"
      note: "higher layer — not part of the −5D…−1D pipeline"
  implementation: "shared/constraint-pipeline.js"

# Primitive (for reference)
primitive:
  name: "Atomics.compareExchange"
  signature: "Atomics.compareExchange(array, index, expected, replacement)"
  phases: [bind, apply, eval, digest]
  reduction: XOR
