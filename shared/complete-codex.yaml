# The Isomorphism Proof
# Automata ≅ Algorithmic ≅ Axiomatic
isomorphism:
  reframings:
    - name: Automata
      origin: "initial state q_0"
      process: "transition δ"
      result: "accepting state F"
    - name: Algorithmic
      origin: "base case"
      process: "step"
      result: "output"
    - name: Axiomatic
      origin: "axiom"
      process: "rule"
      result: "theorem"
  mapping:
    origin:   ["q_0", "base case", "axiom"]
    process:  ["δ", "step", "rule"]
    result:   ["F", "output", "theorem"]
  statement: "Automata ≅ Algorithmic ≅ Axiomatic"

